# 想启用 CI：把这个文件复制到 .github/workflows/build.yml。
# 用 web 界面或带 workflow 作用域的 token 提交，只有 repo 作用域的 token 推不上去。
# 这是起手模板，没有在 GitHub 上实跑过；本机验证过的命令是
#   ./gradlew :app:assembleDebug --console=plain
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: NDK 与 CMake
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"
      - name: local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "cmake.dir=$ANDROID_SDK_ROOT/cmake/3.22.1" >> local.properties
      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: 打 debug 包
        run: ./gradlew :app:assembleDebug --console=plain
